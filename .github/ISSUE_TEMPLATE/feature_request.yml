name: Feature request or improvement
description: Suggest a change, a new capability, or a UX improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. This is a prototype, so proposals that keep it simple and
        demo-able are especially welcome. If your idea depends on the adapter or the host, say so,
        since it may need coordination beyond this repo.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What is awkward, missing, or confusing today? Describe the situation, not just the fix.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to happen? Be concrete about the behaviour or UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Funding / top-up (card, bank, crypto)
        - Deposit / quote
        - Worker / settlement (converting to CASH)
        - History
        - Wallet / host integration
        - Build / CI / tooling
        - Not sure
    validations:
      required: true
