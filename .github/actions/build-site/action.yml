# Install, run the quality gates, build the static site and upload it as an artifact for the
# deploy-site action. Both deploy paths go through this action. The build is offline:
# `postinstall` runs `papi` codegen from the committed .papi/metadata/*.scale.
name: Build site
description: Install deps, run typecheck + unit tests, build the static site, upload it as an artifact.

inputs:
  artifact-name:
    description: Name to upload the built site under; the deploy workflow downloads it by this name.
    default: site
  faucet-seed:
    description: >
      Optional VITE_FAUCET_SEED, inlined into the bundle at build time. Empty is
      valid; the build then has no demo faucet.
    default: ""
  chainflip-broker-api-key:
    description: >
      VITE_CHAINFLIP_BROKER_API_KEY, the Broker-as-a-Service key the Chainflip deposit
      channels open on, inlined at build time. An empty value fails the build (see
      require-secrets): without a key the build shows the crypto withdrawal
      destinations as not available and opens no channel.
    default: ""
  meld-base-url:
    description: >
      VITE_MELD_BASE_URL, the adapter origin the Meld card and bank rail talks to,
      inlined at build time. An empty value fails the build (see require-secrets).
    default: ""
  meld-product-id:
    description: >
      VITE_MELD_PRODUCT_ID, the product id sent as the adapter's `x-dev-product-id`
      header and vetted against its `allowed_products`. Inlined at build time. An
      empty value fails the build for the same reason meld-base-url does (see
      require-secrets): the code falls back to `getcash.dev`, which an adapter
      that does not list it refuses with 401 on every call — a quote that cannot be
      fetched, and a country catalog that silently empties to its fallback list.
    default: ""
  offramp-lanes:
    description: >
      Optional VITE_OFFRAMP_LANES, the off-ramp lanes card and bank sales go through, best first,
      by asset id, not Meld code (e.g. usdt@assethub,dot@assethub,usdc@arbitrum).
      Empty uses the build's default, the direct Asset Hub sales only: the Chainflip swap lane
      (usdc@arbitrum) is offered only when listed here. Solana lanes are never sold through.
    default: ""
  sale-vault-proxy-factory:
    description: >
      Optional VITE_SALE_VAULT_PROXY_FACTORY, the SaleVaultProxyFactory an Arbitrum sale
      delivers to, as packages/sale-vault-proxy's deploy prints it. Both sale-vault-proxy inputs
      empty leaves the Arbitrum lane off; with usdc@arbitrum in offramp-lanes an empty or
      malformed one fails the build (see require-secrets).
    default: ""
  sale-vault-proxy-implementation:
    description: >
      Optional VITE_SALE_VAULT_PROXY_IMPLEMENTATION, the factory's SaleVaultProxy implementation,
      as the same deploy prints it.
    default: ""
  top-up-minimum:
    description: >
      Optional VITE_TOP_UP_MINIMUM, the least a top up can be, in CASH. Empty uses the build's
      default, 1 CASH.
    default: ""
  top-up-maximum:
    description: >
      Optional VITE_TOP_UP_MAXIMUM, the most a top up can be, in CASH. Empty uses the build's
      default, 5000 CASH.
    default: ""
  require-secrets:
    description: >
      Whether an empty meld-base-url, meld-product-id or chainflip-broker-api-key, or
      usdc@arbitrum listed without both sale-vault-proxy inputs, is a build failure. True for
      anything that deploys. Pass false only where the values are legitimately unavailable
      rather than forgotten: a fork or Dependabot PR cannot
      read repo secrets, and its deploy job is skipped anyway, so failing the build
      there would gate the PR on a secret it can never have. Such a build carries the
      offline fake Meld client and cannot open a Chainflip channel, and must never be
      deployed.
    default: "true"

runs:
  using: composite
  steps:
    # Before setup-node: `cache: pnpm` needs pnpm on PATH. The version comes from the
    # packageManager field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Gates, cheapest first.
    - name: Check formatting
      shell: bash
      run: pnpm format:check

    - name: Unit tests
      shell: bash
      run: pnpm test

    - name: Typecheck packages
      shell: bash
      run: pnpm typecheck:packages

    - name: Lint contracts
      shell: bash
      run: pnpm --filter @getsome/sale-vault-proxy run lint

    - name: Contract tests
      shell: bash
      run: pnpm --filter @getsome/sale-vault-proxy run test

    - name: Typecheck app
      shell: bash
      run: pnpm typecheck

    # Before the site build: nuxt generate copies public/ into .output/public, worker bundle
    # included.
    - name: Build worker bundle
      shell: bash
      run: pnpm build:worker

    - name: Build static site
      shell: bash
      env:
        VITE_FAUCET_SEED: ${{ inputs.faucet-seed }}
        VITE_CHAINFLIP_BROKER_API_KEY: ${{ inputs.chainflip-broker-api-key }}
        VITE_MELD_BASE_URL: ${{ inputs.meld-base-url }}
        VITE_MELD_PRODUCT_ID: ${{ inputs.meld-product-id }}
        VITE_OFFRAMP_LANES: ${{ inputs.offramp-lanes }}
        VITE_SALE_VAULT_PROXY_FACTORY: ${{ inputs.sale-vault-proxy-factory }}
        VITE_SALE_VAULT_PROXY_IMPLEMENTATION: ${{ inputs.sale-vault-proxy-implementation }}
        VITE_TOP_UP_MINIMUM: ${{ inputs.top-up-minimum }}
        VITE_TOP_UP_MAXIMUM: ${{ inputs.top-up-maximum }}
        REQUIRE_SECRETS: ${{ inputs.require-secrets }}
      run: |
        if [ -z "$VITE_MELD_BASE_URL" ]; then
          if [ "$REQUIRE_SECRETS" = "true" ]; then
            echo "::error::VITE_MELD_BASE_URL is empty. Set the repo secret VITE_MELD_BASE_URL to the Meld adapter origin; a deployable build must not fall back to the offline fake Meld client."
            exit 1
          fi
          echo "::warning::VITE_MELD_BASE_URL is empty (secrets unavailable for this build). Building with the offline fake Meld client; this artifact must not be deployed."
        fi
        if [ -z "$VITE_MELD_PRODUCT_ID" ]; then
          if [ "$REQUIRE_SECRETS" = "true" ]; then
            echo "::error::VITE_MELD_PRODUCT_ID is empty. Set the repo secret VITE_MELD_PRODUCT_ID to a product id the adapter's allowed_products lists; the fallback (getcash.dev) is refused with 401 by any adapter that does not list it."
            exit 1
          fi
          echo "::warning::VITE_MELD_PRODUCT_ID is empty (secrets unavailable for this build). Building with the fallback product id; this artifact must not be deployed."
        fi
        if [ -z "$VITE_CHAINFLIP_BROKER_API_KEY" ]; then
          if [ "$REQUIRE_SECRETS" = "true" ]; then
            echo "::error::VITE_CHAINFLIP_BROKER_API_KEY is empty. Set the repo secret VITE_CHAINFLIP_BROKER_API_KEY to the Broker-as-a-Service API key; a deployable build must be able to open Chainflip channels."
            exit 1
          fi
          echo "::warning::VITE_CHAINFLIP_BROKER_API_KEY is empty (secrets unavailable for this build). Building with the crypto withdrawals shown as not available; this artifact must not be deployed."
        fi
        lanes=",$(printf '%s' "$VITE_OFFRAMP_LANES" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'),"
        # The rule saleVaultProxyContractsOf applies at runtime, an end-trimmed nonzero 0x address
        proxy_address_ok() {
          local value="$1"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          [[ "$value" =~ ^0x[0-9a-fA-F]{40}$ && ! "$value" =~ ^0x0{40}$ ]]
        }
        if [[ "$lanes" == *",usdc@arbitrum,"* ]] && ! { proxy_address_ok "$VITE_SALE_VAULT_PROXY_FACTORY" && proxy_address_ok "$VITE_SALE_VAULT_PROXY_IMPLEMENTATION"; }; then
          if [ "$REQUIRE_SECRETS" = "true" ]; then
            echo "::error::VITE_OFFRAMP_LANES lists usdc@arbitrum, but VITE_SALE_VAULT_PROXY_FACTORY or VITE_SALE_VAULT_PROXY_IMPLEMENTATION is empty or not a nonzero 0x address. Set both repo variables from packages/sale-vault-proxy's deploy output, or drop usdc@arbitrum."
            exit 1
          fi
          echo "::warning::VITE_OFFRAMP_LANES lists usdc@arbitrum without two valid VITE_SALE_VAULT_PROXY_* addresses (vars unavailable for this build). The Arbitrum lane is off; this artifact must not be deployed."
        fi
        pnpm build

    # upload-artifact@v5 pairs with the download-artifact@v8 in the deploy-site action.
    - name: Upload build artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.artifact-name }}
        path: .output/public
        retention-days: 7
